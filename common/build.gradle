// Loader-neutral code and data. This project is compiled on its own so a Fabric or NeoForge
// import can't sneak in: only Minecraft, Mixin and the JDK are on the classpath. Nothing here
// ships as a jar; `fabric` and `neoforge` compile these sources into theirs.
plugins {
	id 'fabric-loom' version "${loom_version}"
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	// 1.21.1 ships obfuscated (26.x ships Mojang names); the code is written in Mojang names and Loom remaps.
	mappings loom.officialMojangMappings()
	// Only for the Mixin annotations and the launch-side classes they need. No Fabric API here.
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	// Jade API (loader-neutral), for compat/JadePlugin. Compile only; see fabric/build.gradle.
	modCompileOnly "maven.modrinth:jade:${project.jade_fabric_version}"
	modCompileOnly "maven.modrinth:jei:${project.jei_fabric_version}"
	modCompileOnly "maven.modrinth:rei:${project.rei_fabric_version}"
	// REI's API refers to these two (architectury fluids, cloth's Point and Rectangle).
	modCompileOnly "maven.modrinth:architectury-api:${project.architectury_fabric_version}"
	modCompileOnly "maven.modrinth:cloth-config:${project.cloth_config_fabric_version}"
	compileOnly "me.shedaniel.cloth:basic-math:${project.basic_math_version}"

	// Plain unit tests for the pure logic (tier maths): `./gradlew :common:test`.
	testImplementation platform('org.junit:junit-bom:5.11.4')
	testImplementation 'org.junit.jupiter:junit-jupiter'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
	useJUnitPlatform()
}

loom {
	mods {
		"forgemark" {
			sourceSet sourceSets.main
		}
	}
}
