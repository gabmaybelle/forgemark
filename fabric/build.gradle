plugins {
	id 'fabric-loom' version "${loom_version}"
}

// The common sources are compiled straight into this jar (no common jar to bundle), so the
// Fabric mod is one file and Loom can add the mixin refmap the common mixins need.
sourceSets.main {
	java.srcDir project(':common').file('src/main/java')
	resources.srcDir project(':common').file('src/main/resources')
}

loom {
	mods {
		"forgemark" {
			sourceSet sourceSets.main
		}
	}
}

repositories {
	// Beyond the Dragon isn't on Modrinth; its release jars live on GitHub. Only the
	// -PtestBeyondTheDragon run asks for one.
	exclusiveContent {
		forRepository {
			ivy {
				url = 'https://github.com/gabmaybelle/beyond-the-dragon/releases/download/'
				patternLayout {
					artifact 'v[revision]/[artifact]-[revision].jar'
				}
				metadataSources {
					artifact()
				}
			}
		}
		filter {
			includeGroup 'github.gabmaybelle'
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	// 1.21.1 ships obfuscated (26.x ships Mojang names); the code is written in Mojang names and Loom remaps.
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Jade's API, for the hearth and anvil overlay (common/.../compat/JadePlugin). Compile only:
	// nothing is bundled, and the plugin only loads when Jade is installed.
	modCompileOnly "maven.modrinth:jade:${project.jade_fabric_version}"
	// JEI and REI likewise, for the Tempering category (common/.../compat/JeiPlugin, ReiPlugin).
	modCompileOnly "maven.modrinth:jei:${project.jei_fabric_version}"
	modCompileOnly "maven.modrinth:rei:${project.rei_fabric_version}"
	// REI's API refers to these two (architectury fluids, cloth's Point and Rectangle).
	modCompileOnly "maven.modrinth:architectury-api:${project.architectury_fabric_version}"
	modCompileOnly "maven.modrinth:cloth-config:${project.cloth_config_fabric_version}"
	compileOnly "me.shedaniel.cloth:basic-math:${project.basic_math_version}"

	// Compatibility runs: `./gradlew :fabric:runClientGameTest -PtestX` plays the in-game test
	// with another mod installed, fetched from Modrinth's maven by version id (see
	// gradle.properties). Nothing here is bundled or required. Planned: Beyond the Dragon
	// Beyond the Dragon (its GitHub release, see above), Mythic Metals once it reaches 26.3, Tiered.
	if (project.hasProperty("testJade")) {
		modRuntimeOnly "maven.modrinth:jade:${project.jade_fabric_version}"
	}
	if (project.hasProperty("testJei")) {
		modRuntimeOnly "maven.modrinth:jei:${project.jei_fabric_version}"
	}
	if (project.hasProperty("testBeyondTheDragon")) {
		modRuntimeOnly "github.gabmaybelle:beyond-the-dragon-fabric:${project.beyond_the_dragon_version}"
	}
	if (project.hasProperty("testEasyAnvils")) {
		modRuntimeOnly "maven.modrinth:easy-anvils:${project.easy_anvils_fabric_version}"
		modRuntimeOnly "maven.modrinth:puzzles-lib:${project.puzzles_lib_fabric_version}"
		modRuntimeOnly "maven.modrinth:forge-config-api-port:${project.forge_config_api_port_fabric_version}"
	}
	if (project.hasProperty("testRei")) {
		modRuntimeOnly "maven.modrinth:rei:${project.rei_fabric_version}"
		modRuntimeOnly "maven.modrinth:architectury-api:${project.architectury_fabric_version}"
		modRuntimeOnly "maven.modrinth:cloth-config:${project.cloth_config_fabric_version}"
	}
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

// The remapped jar is the one that ships (classic Loom remaps to intermediary); name them all.
base { archivesName = "${rootProject.name}-fabric" }

// Client game tests: `./gradlew :fabric:runClientGameTest` starts a real game and plays through
// the checks in src/gametest. Nothing there ships in the jar. Fabric's client game test API
// doesn't exist for 1.21.1, so the harness is the test's own (in src/gametest, as on Beyond the
// Dragon's 1.21.1 branch) and the run is a plain client run with the test source set as a second mod.
sourceSets {
	gametest {
		compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
		runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
	}
}

loom {
	mods {
		"forgemark_gametest" {
			sourceSet sourceSets.gametest
		}
	}
	runs {
		clientGameTest {
			client()
			name = "Client Game Test"
			source sourceSets.gametest
			runDir "build/run/clientGameTest"
			property "forgemark.gametest", "true"
			// A fixed window so the screenshots are the same size on every machine.
			programArgs "--width", "1280", "--height", "720"
			ideConfigGenerated false
		}
	}
}

// The game test opens the viewers' Tempering tab for a screenshot when one is installed.
dependencies {
	gametestCompileOnly "maven.modrinth:jei:${project.jei_fabric_version}"
	gametestCompileOnly "maven.modrinth:rei:${project.rei_fabric_version}"
	gametestCompileOnly "maven.modrinth:architectury-api:${project.architectury_fabric_version}"
	gametestCompileOnly "maven.modrinth:cloth-config:${project.cloth_config_fabric_version}"
	gametestCompileOnly "me.shedaniel.cloth:basic-math:${project.basic_math_version}"
}
