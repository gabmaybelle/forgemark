plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

// The common sources are compiled straight into this jar (no common jar to bundle), so the
// Fabric mod is one file and Loom can add the mixin refmap the common mixins need.
sourceSets.main {
	java.srcDir project(':common').file('src/main/java')
	resources.srcDir project(':common').file('src/main/resources')
}

loom {
	mods {
		"forgemark" {
			sourceSet sourceSets.main
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Jade's API, for the hearth and anvil overlay (common/.../compat/JadePlugin). Compile only:
	// nothing is bundled, and the plugin only loads when Jade is installed.
	compileOnly "maven.modrinth:jade:${project.jade_fabric_version}"
	// JEI and REI likewise, for the Tempering category (common/.../compat/JeiPlugin, ReiPlugin).
	compileOnly "maven.modrinth:jei:${project.jei_fabric_version}"
	compileOnly "maven.modrinth:rei:${project.rei_fabric_version}"
	// REI's API refers to these two (architectury fluids, cloth's Point and Rectangle).
	compileOnly "maven.modrinth:architectury-api:${project.architectury_fabric_version}"
	compileOnly "maven.modrinth:cloth-config:${project.cloth_config_fabric_version}"
	compileOnly "me.shedaniel.cloth:basic-math:${project.basic_math_version}"

	// Compatibility runs: `./gradlew :fabric:runClientGameTest -PtestX` plays the in-game test
	// with another mod installed, fetched from Modrinth's maven by version id (see
	// gradle.properties). Nothing here is bundled or required. Planned: Beyond the Dragon
	// (aphelite gear, once it reaches 26.3), Mythic Metals once it reaches 26.3, Tiered.
	if (project.hasProperty("testJade")) {
		runtimeOnly "maven.modrinth:jade:${project.jade_fabric_version}"
	}
	if (project.hasProperty("testJei")) {
		runtimeOnly "maven.modrinth:jei:${project.jei_fabric_version}"
	}
	if (project.hasProperty("testEasyAnvils")) {
		runtimeOnly "maven.modrinth:easy-anvils:${project.easy_anvils_fabric_version}"
		runtimeOnly "maven.modrinth:puzzles-lib:${project.puzzles_lib_fabric_version}"
		runtimeOnly "maven.modrinth:forge-config-api-port:${project.forge_config_api_port_fabric_version}"
	}
	if (project.hasProperty("testRei")) {
		runtimeOnly "maven.modrinth:rei:${project.rei_fabric_version}"
		runtimeOnly "maven.modrinth:architectury-api:${project.architectury_fabric_version}"
		runtimeOnly "maven.modrinth:cloth-config:${project.cloth_config_fabric_version}"
	}
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.named('jar') { archiveBaseName = "${rootProject.name}-fabric" }
tasks.named('sourcesJar') { archiveBaseName = "${rootProject.name}-fabric" }

// Client game tests: `./gradlew :fabric:runClientGameTest` starts a real game and plays through
// the checks in src/gametest. Nothing there ships in the jar.
fabricApi {
	configureTests {
		createSourceSet = true
		modId = "forgemark_gametest"
		enableGameTests = false
		enableClientGameTests = true
		eula = true
	}
}

// The game test opens the viewers' Tempering tab for a screenshot when one is installed. This
// comes after configureTests, which is what creates the gametest source set.
dependencies {
	gametestCompileOnly "maven.modrinth:jei:${project.jei_fabric_version}"
	gametestCompileOnly "maven.modrinth:rei:${project.rei_fabric_version}"
	gametestCompileOnly "maven.modrinth:architectury-api:${project.architectury_fabric_version}"
	gametestCompileOnly "maven.modrinth:cloth-config:${project.cloth_config_fabric_version}"
	gametestCompileOnly "me.shedaniel.cloth:basic-math:${project.basic_math_version}"
}
